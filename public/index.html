<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>친구들과 홀덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1512;--panel:#16211d;--line:#26362f;--felt:#14532d;--felt2:#0f3d22;--gold:#e8c26a;--text:#e9efe9;--mute:#93a69b;--red:#d9363e;--accent:#3fb97a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at top,#16251e,var(--bg) 70%);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:#2a3a33;color:var(--text);transition:.12s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--accent);color:#06210f}
button.gold{background:var(--gold);color:#2a1d00}
button.danger{background:#6b1f24}
input{font:inherit;background:#0d1512;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 span{color:var(--gold)}
#tinfo{color:var(--mute);font-size:13px}
#status{margin-left:auto;font-size:12px;color:var(--gold)}
#lobby{max-width:420px;margin:48px auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
#lobby h2{margin:0 0 6px;font-size:22px}
#lobby p{color:var(--mute);font-size:14px;line-height:1.6;margin:0 0 18px}
#lobby label{display:block;font-size:13px;color:var(--mute);margin:12px 0 6px}
#lobby input{width:100%}
#lobby button{width:100%;margin-top:18px}
#lobbyMsg{color:var(--gold);font-size:13px;margin-top:12px;line-height:1.5}
#game{display:grid;grid-template-columns:1fr 280px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:860px){#game{grid-template-columns:1fr}}
.table-wrap{position:relative;width:100%;aspect-ratio:16/10;min-height:340px}
.felt{position:absolute;inset:9% 7%;border-radius:999px;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));border:10px solid #3a2a16;box-shadow:inset 0 0 40px #0008,0 10px 30px #0008}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
#board{display:flex;gap:6px;justify-content:center;min-height:62px}
#pot{margin-top:8px;font-weight:800;color:var(--gold);font-size:15px}
#phase{font-size:12px;color:#bfe3cc;opacity:.8;margin-top:2px}
.seat{position:absolute;transform:translate(-50%,-50%);width:118px;text-align:center;z-index:2}
.seat .box{background:#0d1512e6;border:2px solid var(--line);border-radius:12px;padding:6px 6px 5px}
.seat.turn .box{border-color:var(--gold);box-shadow:0 0 14px #e8c26a88}
.seat.me .box{border-color:#3fb97a88}
.seat.me.turn .box{border-color:var(--gold)}
.seat.folded{opacity:.45}
.seat.win .box{border-color:var(--accent);box-shadow:0 0 18px #3fb97aaa}
.seat .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .st{font-size:12px;color:var(--gold)}
.seat .off{font-size:10px;color:#e46b6b}
.seat .sub{font-size:10.5px;color:var(--mute)}
.seat .cards{display:flex;justify-content:center;gap:3px;margin-bottom:4px;min-height:40px}
.seat .bet{position:absolute;left:50%;transform:translateX(-50%);background:#000a;border:1px solid var(--gold);color:var(--gold);font-size:11px;padding:1px 8px;border-radius:99px;white-space:nowrap}
.dbtn{display:inline-block;background:#fff;color:#111;border-radius:50%;width:17px;height:17px;font-size:10px;line-height:17px;font-weight:800;margin-right:3px}
.tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:5px;background:#6b1f24;margin-left:3px}
.card{width:40px;height:56px;background:#fbfbf7;border-radius:6px;color:#151515;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;box-shadow:0 2px 4px #0006;user-select:none}
.card .r{font-size:17px}.card .s{font-size:17px;margin-top:2px}
.card.red{color:var(--red)}
.card.sm{width:28px;height:40px}.card.sm .r,.card.sm .s{font-size:12px}
.card.lg{width:62px;height:86px}.card.lg .r,.card.lg .s{font-size:26px}
.card.back{background:repeating-linear-gradient(45deg,#7a1d24 0 4px,#93262e 4px 8px);border:2px solid #f2e6d0}
.card.empty{background:#ffffff10;box-shadow:none;border:1px dashed #ffffff30}
.card.hl{outline:3px solid var(--gold);outline-offset:-1px}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#mine{display:flex;gap:6px;align-items:center}
#mine .info{font-size:13px;color:var(--mute);margin-left:6px;line-height:1.5}
#mine .info b{color:var(--gold);font-size:15px}
#actions{flex:1;display:flex;flex-direction:column;gap:8px;min-width:260px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input[type=range]{flex:1;accent-color:var(--gold)}
.row input[type=number]{width:96px}
.hint{color:var(--mute);font-size:13px}
aside{display:flex;flex-direction:column;gap:12px}
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card-box h3{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
#log div{font-size:12.5px;padding:3px 0;border-bottom:1px solid #ffffff08;color:#cfdcd3}
#result .pt{font-size:13px;margin:4px 0}
#result .pt b{color:var(--gold)}
#result .hd{display:flex;align-items:center;gap:6px;font-size:12px;margin:5px 0}
#board-list .pl{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.pos{color:var(--accent)}.neg{color:#e46b6b}
#settings .row{margin:6px 0}
#settings label{font-size:12px;color:var(--mute);width:84px}
#settings input{width:90px;padding:6px 8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#223129;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:#a33}
@media(max-width:560px){.seat{width:86px}.seat .nm{font-size:11px}.card{width:30px;height:42px}.card .r,.card .s{font-size:13px}.card.sm{width:22px;height:31px}.card.sm .r,.card.sm .s{font-size:10px}.card.lg{width:48px;height:66px}.table-wrap{aspect-ratio:4/5}.felt{inset:12% 6%}}
.tbar{height:4px;background:#ffffff1a;border-radius:3px;margin-top:4px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold);width:100%;transition:width 1s linear}
.tbar.low i{background:#e54b4b}
.seat.turn.low .box{animation:pulse .5s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 22px #e54b4bcc;border-color:#e54b4b}}
.eq{position:absolute;top:-10px;right:-10px;background:#111;border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:12px;padding:1px 6px;border-radius:8px;z-index:3}
.eq.lead{background:var(--gold);color:#221a00}
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;font-weight:800;font-size:13px;padding:4px 10px;border-radius:12px;white-space:nowrap;animation:pop 1.9s ease forwards;box-shadow:0 3px 10px #0008}
.bubble.raise,.bubble.bet{background:var(--gold)}
.bubble.allin{background:#e5323b;color:#fff;font-size:15px}
.bubble.fold{background:#555;color:#ddd}
.bubble.chat{background:#e9f5ee;color:#111;font-weight:600;max-width:190px;white-space:normal;animation-duration:4.5s}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-60%) scale(.6)}10%{opacity:1;transform:translate(-50%,-100%) scale(1.08)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-125%)}}
.float{position:absolute;transform:translate(-50%,-50%);font-size:32px;animation:rise 2.2s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.25)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-280%) scale(1)}}
.plus{position:absolute;transform:translate(-50%,-50%);color:#7dffb0;font-weight:900;font-size:24px;text-shadow:0 2px 6px #000;animation:rise 2.6s ease-out forwards}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(30px,7vw,72px);font-weight:900;color:#fff;text-shadow:0 0 24px #e5323b,0 5px 0 #7a0f14;letter-spacing:2px;animation:slam 1.7s ease forwards;white-space:nowrap}
.banner.win{text-shadow:0 0 24px #3fb97a,0 4px 0 #0e4d2b;font-size:clamp(20px,4.5vw,42px)}
.banner.info{text-shadow:0 0 20px #e8c26a,0 4px 0 #6b5000;font-size:clamp(20px,4vw,38px)}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.dealin{animation:dealin .5s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes dealin{from{opacity:0;transform:translate(var(--fx,0),var(--fy,0)) rotate(-40deg) scale(.4)}}
.flip{animation:flip .6s ease both}
.flip.slow{animation:squeeze 1.6s ease both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8);filter:brightness(.3)}60%{transform:rotateY(-10deg) scale(1.1)}100%{transform:none}}
@keyframes squeeze{0%{transform:rotateY(90deg) scale(.9);filter:brightness(.2)}55%{transform:rotateY(70deg) scale(1.15);filter:brightness(.4)}80%{transform:rotateY(-8deg) scale(1.2)}100%{transform:none}}
.wrap-runout .felt{box-shadow:inset 0 0 90px #000d,0 0 50px #e5323b66}
.wrap-runout #phase{color:#ff9a9f;opacity:1;font-weight:700}
.confetti{position:absolute;width:8px;height:13px;top:50%;left:50%;border-radius:2px;animation:conf 2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
#chatBox .msgs{height:210px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;word-break:break-word}
#chatBox .msgs .sys{color:var(--mute);font-size:12px}
#chatBox .msgs b{color:var(--gold);font-weight:600;margin-right:5px}
#chatBox form{display:flex;gap:6px}#chatBox input{flex:1;min-width:0}#chatBox button{padding:8px 12px}
.reacts{display:flex;gap:4px;flex-wrap:wrap;width:100%;border-top:1px solid var(--line);padding-top:10px}
.reacts button{padding:5px 8px;font-size:18px;background:#1f2b26;border-radius:8px}
#muteBtn{background:transparent;font-size:18px;padding:4px 8px}
.rebuyRow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:5px 0;gap:6px}
.rebuyRow button{padding:5px 10px;font-size:12px}
.reqtag{font-size:10px;background:var(--gold);color:#221a00;border-radius:5px;padding:0 5px;margin-left:4px}
.stack{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2;pointer-events:none}
.stack .cols{display:flex;gap:2px;align-items:flex-end}
.stack .col{display:flex;flex-direction:column-reverse}
.chip{width:22px;height:7px;border-radius:5px/3px;margin-top:-2px;box-shadow:0 1px 0 #0008,inset 0 -1px 0 #0005}
.stack .amt{font-size:11px;font-weight:800;color:var(--gold);background:#000b;border-radius:99px;padding:0 7px;margin-top:3px;white-space:nowrap}
#potStack{position:relative;display:flex;justify-content:center;margin-top:8px;min-height:6px}
#potStack .stack{position:static;transform:none}
#potStack .chip{width:26px;height:8px}
.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.15)}}
.fchip{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:3px dashed #ffffffb0;box-shadow:0 2px 5px #0009;z-index:7}
.chipin{animation:chipin .35s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes chipin{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
#blindInfo{font-size:11.5px;color:var(--gold);margin-top:3px;opacity:.9}
select{font:inherit;background:#0d1512;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px}
@media(max-width:560px){.chip{width:16px;height:5px;margin-top:-1.5px}.stack .amt{font-size:10px}#potStack .chip{width:20px;height:6px}}
</style>
</head>
<body>
<header><h1>♠ 친구들과 <span>홀덤</span></h1><div id="tinfo"></div><div id="status"></div><button id="muteBtn" title="효과음 켜기/끄기">🔊</button></header>

<section id="lobby">
  <h2>테이블에 앉기</h2>
  <p>같은 테이블 코드를 입력한 친구들끼리 한 판에서 만나요. 칩은 게임용 가상 칩이에요. 입장한 뒤 주소창 링크를 친구에게 보내면 같은 테이블로 바로 와요.</p>
  <div id="lobbyForm" hidden>
    <label for="nick">닉네임</label><input id="nick" maxlength="12" placeholder="예: 민">
    <label for="code">테이블 코드</label><input id="code" maxlength="20" placeholder="main">
    <button class="pri" id="joinBtn">입장</button>
  </div>
  <div id="lobbyMsg">연결 중…</div>
</section>

<section id="game" hidden>
  <div>
    <div class="table-wrap"><div class="felt"><div id="center"><div id="board"></div><div id="potStack"></div><div id="pot"></div><div id="phase"></div><div id="blindInfo"></div></div></div><div id="seats"></div><div class="fx" id="fx"></div></div>
    <div id="panel"><div id="mine"></div><div id="actions"></div><div class="reacts" id="reacts"></div></div>
  </div>
  <aside>
    <div class="card-box" id="chatBox"><h3>채팅</h3><div class="msgs" id="msgs"></div><form id="chatForm"><input id="chatIn" maxlength="200" placeholder="메시지 입력…" autocomplete="off"><button class="pri">전송</button></form></div>
    <div class="card-box" id="resultBox" hidden><h3>지난 핸드 결과</h3><div id="result"></div></div>
    <div class="card-box"><h3>순위 (리바이 반영 손익)</h3><div id="board-list"></div></div>
    <div class="card-box"><h3>기록</h3><div id="log"></div></div>
    <div class="card-box" id="settings"><h3>테이블 설정 (방장)</h3>
      <div class="row"><label>스몰 블라인드</label><input type="number" id="sSb" min="1"></div>
      <div class="row"><label>빅 블라인드</label><input type="number" id="sBb" min="1"></div>
      <div class="row"><label>시작 칩</label><input type="number" id="sStart" min="10"></div>
      <div class="row"><label>블라인드 상승</label><select id="sBlMode"><option value="off">끄기</option><option value="hands">N핸드마다</option><option value="minutes">N분마다</option></select><input type="number" id="sBlEvery" min="1" style="width:64px"></div>
      <div class="row"><button id="applyBl">상승 규칙 적용</button><button class="gold" id="blUpNow">다음 핸드부터 올리기 ⬆️</button></div>
      <div class="row"><button id="applySet">적용</button><button class="danger" id="resetBtn">테이블 초기화</button></div>
      <div class="hint" id="setHint"></div>
      <h3 style="margin-top:12px">리바이 주기</h3><div id="rebuyAdmin"></div>
    </div>
  </aside>
</section>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/logic.js"></script>
<script>
const $ = s => document.querySelector(s);
const ACTIVE = ['preflop', 'flop', 'turn', 'river'];
const PHASE_KO = { waiting: '대기 중', preflop: '프리플랍', flop: '플랍', turn: '턴', river: '리버', showdown: '핸드 종료' };
const REACTS = ['😂', '😱', '🔥', '👏', '🤔', '😭', '😎', '🙏'];
let socket = null, uid = null, code = null, game = null, seats = {}, hostId = null, deadline = 0, turnTotal = 45000, skew = 0;
let busy = false, panelKey = null, resetArmed = false, joined = false;
let posOf = {}, prev = null, dealAt = 0, flipAt = {}, myName = '';

// ---------- 효과음 (WebAudio로 즉석 합성) ----------
let actx = null, muted = (store('holdem-mute') === '1');
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { actx = null; } } if (actx && actx.state === 'suspended') actx.resume().catch(() => {}); return actx; }
document.addEventListener('pointerdown', () => audio(), { once: true });
function tone(f, dur, type, vol, when, f2) {
  const a = audio(); if (!a || muted) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || .2, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, when, freq) {
  const a = audio(); if (!a || muted) return;
  const t = a.currentTime + (when || 0), len = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'bandpass'; f.frequency.value = freq || 3000; g.gain.value = vol || .3;
  src.buffer = b; src.connect(f).connect(g).connect(a.destination); src.start(t);
}
const sfx = {
  deal: n => { for (let i = 0; i < n; i++) noise(.06, .35, i * .09, 4500); },
  flip: () => noise(.12, .4, 0, 2500),
  chip: () => { tone(2400, .05, 'square', .06); tone(3100, .05, 'square', .05, .05); tone(2700, .06, 'square', .04, .1); },
  check: () => { tone(160, .08, 'sine', .5); tone(150, .08, 'sine', .45, .12); },
  fold: () => noise(.25, .2, 0, 900),
  allin: () => { tone(70, 1.1, 'sawtooth', .18, 0, 140); tone(110, 1.1, 'sawtooth', .12, 0, 220); tone(880, .4, 'triangle', .12, .7, 1320); },
  turn: () => { tone(880, .15, 'sine', .2); tone(1320, .25, 'sine', .2, .12); },
  tick: () => tone(1500, .03, 'square', .05),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, 'triangle', .18, i * .1)),
  heart: () => { tone(55, .15, 'sine', .5); tone(50, .15, 'sine', .4, .2); },
  pop: () => tone(600, .08, 'sine', .15, 0, 900),
};
function setMute(m) { muted = m; store('holdem-mute', m ? '1' : '0'); $('#muteBtn').textContent = m ? '🔇' : '🔊'; }
$('#muteBtn').onclick = () => setMute(!muted);

// ---------- 공통 ----------
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2800); }
function cardEl(c, size, hl) {
  const d = document.createElement('div'); d.className = 'card' + (size ? ' ' + size : '');
  if (c === null) { d.classList.add('empty'); return d; }
  if (typeof c !== 'string' || !/^[2-9TJQKA][shdc]$/.test(c)) { d.classList.add('back'); return d; }
  if (c[1] === 'h' || c[1] === 'd') d.classList.add('red');
  if (hl && hl.includes(c)) d.classList.add('hl');
  const r = document.createElement('span'); r.className = 'r'; r.textContent = c[0] === 'T' ? '10' : c[0];
  const s = document.createElement('span'); s.className = 's'; s.textContent = { s: '♠', h: '♥', d: '♦', c: '♣' }[c[1]];
  d.append(r, s); return d;
}

    const ra = $('#rebuyAdmin'); ra.innerHTML = '';
    const broke = ps.filter(p => p.stack === 0 && !(p.inHand && !p.folded && inHandNow()));
    if (!broke.length) ra.append(el('div', 'hint', '칩을 다 잃은 사람이 없어요'));
    broke.forEach(p => {
      const s = seats[p.id] || {}, pending = (s.rebuys || 0) > (p.seen || 0);
      const row = el('div', 'rebuyRow'), nm = el('span', '', p.name); if (s.rebuyReq) nm.append(el('span', 'reqtag', '요청'));
      row.append(nm, pending ? el('span', 'hint', '다음 핸드 반영') : btn(`+${g.settings.start.toLocaleString()} 주기`, 'gold', () => run('giveRebuy', { pid: p.id }, '리바이를 줬어요')));
      ra.append(row);
    });
  }
  renderPanel();
}

function renderPanel() {
  if (!game) return;
  const g = game, ps = g.players || [], me = ps.find(p => p.id === uid), my = seats[uid];
  const seated = my && !my.left, myTurn = inHandNow() && !g.runout && ps[g.toAct] && ps[g.toAct].id === uid;
  const key = JSON.stringify([busy, g.phase, g.runout, g.handNo, g.toAct, g.currentBet, me && [me.stack, me.bet, me.hole, me.folded, me.seen], seated, my && [my.rebuys, my.rebuyReq], g.board, ps.length, g.shown, Object.values(seats).filter(s => !s.left).length]);
  if (key === panelKey) { tick(); return; }
  panelKey = key;
  const mine = $('#mine'), A = $('#actions'); mine.innerHTML = ''; A.innerHTML = '';
  if (me && me.inHand && (me.hole || []).length) {
    me.hole.forEach((c, ci) => { const ce = cardEl(c, 'lg', winnersInfo().hl); if (dealAt) animFrom(ce, 'dealin', dealAt, 300 + ci * 150); mine.append(ce); });
    const all = [...me.hole, ...(g.board || [])];
    const info = el('div', 'info'); info.append(el('b', '', me.stack.toLocaleString() + ' 칩'));
    if (all.length >= 5) info.append(el('div', '', '현재 패: ' + handName(bestHand(all).score)));
    if (g.runout && g.equity && g.equity[uid] != null) info.append(el('div', '', `승률 ${g.equity[uid]}%`));
    if (me.folded) info.append(el('div', '', '폴드함'));
    mine.append(info);
  } else {
    const info = el('div', 'info'); info.append(el('b', '', (me ? me.stack : g.settings.start).toLocaleString() + ' 칩'));
    info.append(el('div', '', seated ? (inHandNow() ? '이번 핸드는 관전 중' : '대기 중') : '관전 중')); mine.append(info);
  }
  if (busy) { A.append(el('div', 'hint', '처리 중…')); return; }
  if (!seated) { A.append(btn('다시 앉기', 'pri', () => run('sit', {}, '자리에 앉았어요'))); return; }
  if (g.runout) { A.append(el('div', 'hint', '🔥 올인 — 카드가 한 장씩 공개됩니다…')); return; }
  if (myTurn) {
    const toCall = g.currentBet - me.bet, maxTo = me.bet + me.stack;
    const r1 = el('div', 'row');
    r1.append(btn('폴드', 'danger', () => act('fold')));
    r1.append(btn(toCall > 0 ? `콜 ${Math.min(toCall, me.stack).toLocaleString()}${toCall >= me.stack ? ' (올인)' : ''}` : '체크', 'pri', () => act(toCall > 0 ? 'call' : 'check')));
    A.append(r1);
    if (maxTo > g.currentBet) {
      const minTo = Math.min(g.currentBet + g.minRaise, maxTo), word = g.currentBet === 0 ? '벳' : '레이즈';
      const r2 = el('div', 'row'), rg = el('input'), num = el('input');
      rg.type = 'range'; rg.min = minTo; rg.max = maxTo; rg.step = Math.max(1, g.settings.sb); rg.value = minTo;
      num.type = 'number'; num.min = minTo; num.max = maxTo; num.value = minTo;
      const go = btn(`${word} ${minTo.toLocaleString()}`, 'gold', () => act('raise', +num.value));
      const sync = v => { v = Math.max(minTo, Math.min(maxTo, Math.floor(+v || minTo))); rg.value = v; num.value = v; go.textContent = `${word} ${v.toLocaleString()}${v === maxTo ? ' (올인)' : ''}`; };
      rg.oninput = () => sync(rg.value); num.onchange = () => sync(num.value);
      r2.append(rg, num, go); A.append(r2);
      const r3 = el('div', 'row'), pot = potTotal();
      [['½ 팟', .5], ['팟', 1]].forEach(([t, f]) => r3.append(btn(t, '', () => sync(g.currentBet + Math.round((pot + toCall) * f)))));
      r3.append(btn('올인', '', () => sync(maxTo)));
      A.append(r3);
    }
    const h = el('div', 'hint'); h.id = 'turnTimer'; A.append(h);
    tick(); return;
  }
  if (inHandNow()) {
    const cur = ps[g.toAct];
    const r = el('div', 'row'); r.append(el('span', 'hint', `${(cur && cur.name) || '?'} 님 차례`));
    const t = el('span', 'hint'); t.id = 'turnTimer'; r.append(t); A.append(r);
    const r2 = el('div', 'row'); r2.append(btn('자리 떠나기', '', () => run('leave', {}, '자리에서 일어났어요'))); A.append(r2);
    tick(); return;
  }
  const r = el('div', 'row');
  r.append(btn(g.handNo ? '다음 핸드 시작' : '게임 시작', 'pri', () => run('start')));
  if (g.phase === 'showdown' && me && (me.hole || []).length === 2 && !(g.shown && g.shown[uid]) && !(g.result && g.result.hands && g.result.hands[uid]))
    r.append(btn('내 패 보여주기 👀', '', () => run('show')));
  const pendingRebuy = my && me && (my.rebuys || 0) > (me.seen || 0);
  if (me && me.stack === 0 && !pendingRebuy) {
    if (hostId === uid) r.append(btn(`리바이 (+${g.settings.start.toLocaleString()})`, 'gold', () => run('giveRebuy', { pid: uid }, '다음 핸드 시작 때 칩이 채워져요')));
    else r.append(btn(my.rebuyReq ? '리바이 요청함' : '방장에게 리바이 요청', 'gold', () => run('rebuyRequest', {}, '방장에게 요청했어요'))), my.rebuyReq && (r.lastChild.disabled = true);
  }
  r.append(btn('자리 떠나기', '', () => run('leave', {}, '자리에서 일어났어요')));
  A.append(r);
  const cnt = Object.values(seats).filter(s => !s.left).length;
  A.append(el('div', 'hint', pendingRebuy ? '리바이 받음 — 다음 핸드부터 반영돼요' : cnt < 2 ? '친구가 같은 테이블 코드로 들어오면 시작할 수 있어요' : `앉은 사람 ${cnt}명 · 아무나 시작 버튼을 누르면 돼요`));
}

function blindText(g) {
  const b = g.blinds; if (!b) return '';
  if (b.pending) return '⬆️ 다음 핸드부터 블라인드 상승';
  if (b.mode === 'hands') { const left = Math.max(0, b.every - ((g.handNo || 0) - b.sinceHand)); return !g.handNo ? `블라인드 ${b.every}핸드마다 상승` : left === 0 ? '⬆️ 다음 핸드부터 블라인드 상승' : `${left}핸드 더 하면 블라인드 상승`; }
  if (b.mode === 'minutes') {
    if (!g.handNo) return `블라인드 ${b.every}분마다 상승`;
    const ms = b.sinceAt + b.every * 60000 - (Date.now() - skew);
    if (ms <= 0) return '⬆️ 다음 핸드부터 블라인드 상승';
    const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; return `다음 블라인드 상승까지 ${m}:${String(s).padStart(2, '0')}`;
  }
  return '';
}
setInterval(() => { if (game && $('#blindInfo')) $('#blindInfo').textContent = blindText(game); }, 1000);
let lastTickSec = -1;
function tick() {
  if (!inHandNow() || game.runout || !deadline) return;
  const remainMs = deadline - (Date.now() - skew);
  const left = Math.max(0, Math.ceil(remainMs / 1000));
  const mine = game.players[game.toAct] && game.players[game.toAct].id === uid;
  const t = $('#turnTimer'); if (t) t.textContent = mine ? `내 차례예요 · ${left}초 남음 (시간이 지나면 자동 체크/폴드)` : `· ${left}초`;
  const total = turnTotal, frac = Math.max(0, Math.min(1, remainMs / total));
  const bar = $('.seat.turn .tbar'); if (bar) { bar.firstChild.style.width = (frac * 100) + '%'; bar.classList.toggle('low', left <= 10); }
  const ts = $('.seat.turn'); if (ts) ts.classList.toggle('low', left <= 10);
  if (mine && left <= 10 && left > 0 && left !== lastTickSec) { lastTickSec = left; sfx.tick(); }
}
setInterval(tick, 1000);
window.addEventListener('resize', () => { if (game) render(); });

$('#applySet').onclick = () => run('settings', { sb: $('#sSb').value, bb: $('#sBb').value, start: $('#sStart').value }, '설정을 바꿨어요');
$('#sBlMode').onchange = () => { $('#sBlEvery').disabled = $('#sBlMode').value === 'off'; if (!$('#sBlEvery').value || $('#sBlMode').value === 'minutes' && +$('#sBlEvery').value > 180) $('#sBlEvery').value = $('#sBlMode').value === 'minutes' ? 10 : 8; };
$('#applyBl').onclick = () => run('blinds', { mode: $('#sBlMode').value, every: $('#sBlEvery').value }, '블라인드 규칙을 바꿨어요');
$('#blUpNow').onclick = () => run('blindUpNow', {}, '블라인드 상승 예약!');
$('#resetBtn').onclick = () => {
  if (!resetArmed) { resetArmed = true; $('#resetBtn').textContent = '정말 초기화? (다시 클릭)'; setTimeout(() => { resetArmed = false; $('#resetBtn').textContent = '테이블 초기화'; }, 4000); return; }
  resetArmed = false; $('#resetBtn').textContent = '테이블 초기화';
  run('reset', {}, '초기화했어요');
};
init();
</script>
</body>
